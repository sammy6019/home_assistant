# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

command_line:
  - sensor:
      name: "Disk Usage Percent"
      command: "df / | tail -1 | awk '{print int($5)}'"
      unit_of_measurement: "%"
      scan_interval: 300

  - sensor:
      name: "Memory Usage Percent"
      command: "free | grep Mem | awk '{printf(\"%.0f\", $3/$2 * 100)}'"
      unit_of_measurement: "%"
      scan_interval: 300

  - sensor:
      name: "Available Storage"
      command: "df / | tail -1 | awk '{print int($4/1048576)}'"
      unit_of_measurement: "GB"
      scan_interval: 300
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.17.0.0/16
    - 172.18.0.0/16
    - 127.0.0.1
    - ::1
    - 192.168.1.227

shell_command:
  run_flood_monitor: "python3 /mnt/ssd/flood-monitor/flood_monitor.py"

rest:
  - scan_interval: 60
    resource: http://192.168.1.227:8082/api/status
    sensor:
      - name: "Flood Monitor Running"
        value_template: "{{ 'active' if value_json.running else 'idle' }}"

  - scan_interval: 60
    resource: http://192.168.1.227:8082/api/events
    sensor:
      - name: "Flood Last Check"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].timestamp[:16] | replace('T', ' ') }}{% else %}unknown{% endif %}
      - name: "Flood Water Level"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].level }}{% else %}unknown{% endif %}
      - name: "Flood Alert Active"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].flood_detected }}{% else %}false{% endif %}
      - name: "Flood Last Snapshot"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].snapshot | default('') }}{% else %}{% endif %}
      - name: "Flood Event Count"
        value_template: "{{ value_json | length }}"
