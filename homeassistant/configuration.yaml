# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

command_line:
  - sensor:
      name: "Disk Usage Percent"
      command: "df / | tail -1 | awk '{print int($5)}'"
      unit_of_measurement: "%"
      scan_interval: 300

  - sensor:
      name: "Memory Usage Percent"
      command: "free | grep Mem | awk '{printf(\"%.0f\", $3/$2 * 100)}'"
      unit_of_measurement: "%"
      scan_interval: 300

  - sensor:
      name: "Available Storage"
      command: "df / | tail -1 | awk '{print int($4/1048576)}'"
      unit_of_measurement: "GB"
      scan_interval: 300
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.17.0.0/16
    - 172.18.0.0/16
    - 127.0.0.1
    - ::1
    - 192.168.1.227

input_boolean:
  doorbell_active:
    name: Doorbell Active
    icon: mdi:doorbell

input_text:
  doorbell_last_classification:
    name: Doorbell Last Classification
    initial: none

rest_command:
  doorbell_ai_trigger:
    url: http://192.168.1.227:5001/doorbell
    method: POST
    timeout: 60

shell_command:
  run_flood_monitor: "python3 /mnt/ssd/flood-monitor/flood_monitor.py"

rest:
  - scan_interval: 60
    resource: http://192.168.1.227:8082/api/status
    sensor:
      - name: "Flood Monitor Running"
        value_template: "{{ 'active' if value_json.running else 'idle' }}"

  - scan_interval: 60
    resource: http://192.168.1.227:8082/api/events
    sensor:
      - name: "Flood Last Check"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].timestamp[:16] | replace('T', ' ') }}{% else %}unknown{% endif %}
      - name: "Flood Water Level"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].level }}{% else %}unknown{% endif %}
      - name: "Flood Alert Active"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].flood_detected }}{% else %}false{% endif %}
      - name: "Flood Last Snapshot"
        value_template: >
          {% set events = value_json %}
          {% if events %}{{ events[-1].snapshot | default('') }}{% else %}{% endif %}
      - name: "Flood Event Count"
        value_template: "{{ value_json | length }}"

  - scan_interval: 30
    resource: http://192.168.1.227:5001/doorbell/last
    sensor:
      - name: "Doorbell Last Classification"
        value_template: "{{ value_json.classification | default('none') }}"
      - name: "Doorbell Last Event"
        value_template: >
          {% if value_json.timestamp %}{{ value_json.timestamp[:16] | replace('T', ' ') }}{% else %}never{% endif %}

  - scan_interval: 300
    resource: http://192.168.1.227:8001/api/portfolio/overview
    sensor:
      - name: "Finance Total Value"
        value_template: "{{ value_json.total_value | round(2) }}"
        unit_of_measurement: "USD"
      - name: "Finance Total Gain Pct"
        value_template: "{{ value_json.total_gain_pct | round(2) }}"
        unit_of_measurement: "%"
      - name: "Finance Day Change Pct"
        value_template: "{{ value_json.total_day_pct | round(2) }}"
        unit_of_measurement: "%"
      - name: "Finance Day Change Dollar"
        value_template: "{{ value_json.total_day_change | round(2) }}"
        unit_of_measurement: "USD"

  - scan_interval: 300
    resource: http://192.168.1.227:8001/api/portfolio/schwab
    sensor:
      - name: "Schwab Total Value"
        value_template: "{{ value_json.total_value | round(2) }}"
        unit_of_measurement: "USD"
      - name: "Schwab Day Change Pct"
        value_template: "{{ value_json.day_change_pct | round(2) }}"
        unit_of_measurement: "%"

  - scan_interval: 300
    resource: http://192.168.1.227:8001/api/portfolio/coinbase
    sensor:
      - name: "Coinbase Total Value"
        value_template: "{{ value_json.total_value | round(2) }}"
        unit_of_measurement: "USD"
      - name: "Coinbase Day Change Pct"
        value_template: "{{ value_json.day_change_pct | round(2) }}"
        unit_of_measurement: "%"

  - scan_interval: 300
    resource: http://192.168.1.227:8001/api/portfolio/robinhood
    sensor:
      - name: "Robinhood Total Value"
        value_template: "{{ value_json.total_value | round(2) }}"
        unit_of_measurement: "USD"
      - name: "Robinhood Day Change Pct"
        value_template: "{{ value_json.day_change_pct | round(2) }}"
        unit_of_measurement: "%"
