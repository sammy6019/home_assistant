- id: '1777826795106'
  alias: Disk Space Warning
  description: ''
  triggers:
  - entity_id: sensor.disk_usage_percent
    above: 80
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      title: ⚠️ Disk Space Warning
      message: Disk usage is {{ states('sensor.disk_usage_percent') }}% - Consider
        cleaning up
    action: persistent_notification.create
  mode: single
- id: '1777826829389'
  alias: Memory Usage Warning
  description: ''
  triggers:
  - entity_id: sensor.memory_usage_percent
    above: 85
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      title: ⚠️ Memory Usage Warning
      message: Memory usage is {{ states('sensor.memory_usage_percent') }}%
    action: persistent_notification.create
  mode: single
- id: '1780000000001'
  alias: Nest Low Temperature Alert
  description: Notify and log when living room temperature drops below 65°F
  triggers:
  - entity_id: sensor.living_room_temperature
    below: 65
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      title: "\U0001F9CA Low Temperature Alert"
      message: "Living room temperature has dropped to {{ states('sensor.living_room_temperature') }}\
        °F - below the 65°F threshold."
    action: notify.mobile_app_iphone
  - data:
      title: "\U0001F9CA Low Temperature Alert"
      message: "Living room temperature dropped to {{ states('sensor.living_room_temperature') }}\
        °F at {{ now().strftime('%H:%M') }}"
    action: persistent_notification.create
  - data:
      message: "LOW TEMP ALERT: Living room at {{ states('sensor.living_room_temperature') }}\
        °F (threshold: 65°F)"
      level: warning
    action: system_log.write
  mode: single
- id: '1777838287855'
  alias: Daily Home Summary
  description: ''
  triggers:
  - at: 08:00:00
    trigger: time
  actions:
  - data:
      text: Give me a brief summary of today
      agent_id: conversation.ollama_conversation
    action: conversation.process
  mode: single

- id: 'shark_vacuum_error_notify'
  alias: Shark Vacuum Error Notification
  description: Notify when shark vacuum encounters an error (e.g. bin full, stuck)
  triggers:
  - trigger: state
    entity_id: vacuum.shark_robot_vacuum
    to: 'error'
  conditions: []
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: "Shark Vacuum Error"
      message: "Vacuum stopped: {{ state_attr('vacuum.shark_robot_vacuum', 'status') | default('unknown error') }}. Battery: {{ state_attr('vacuum.shark_robot_vacuum', 'battery_level') | default('?') }}%"
      data:
        actions:
          - action: RESUME_VACUUM
            title: Resume Cleaning
  - action: system_log.write
    data:
      message: >
        SHARK VACUUM ERROR: status={{ state_attr('vacuum.shark_robot_vacuum', 'status') }},
        battery={{ state_attr('vacuum.shark_robot_vacuum', 'battery_level') }}%
      level: warning
  mode: single

- id: 'shark_vacuum_resume_action'
  alias: Shark Vacuum Resume from Notification
  description: Resume vacuum when user taps Resume in notification
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: RESUME_VACUUM
  conditions: []
  actions:
  - action: vacuum.start
    target:
      entity_id: vacuum.shark_robot_vacuum
  mode: single

- id: 'shark_vacuum_bin_full_notify'
  alias: Shark Vacuum Bin Full Notification
  description: Notify when dust bin is full
  triggers:
  - trigger: state
    entity_id: binary_sensor.shark_robot_vacuum_bin_full
    to: 'on'
  conditions: []
  actions:
  - action: notify.mobile_app_iphone
    data:
      title: "Shark Vacuum - Bin Full"
      message: "Empty the dust bin then tap Resume to continue cleaning."
      data:
        actions:
          - action: RESUME_VACUUM
            title: Resume Cleaning
  mode: single

- id: 'doorbell_reset_active'
  alias: Doorbell Reset Active Flag
  description: Auto-clear doorbell active flag after 30 seconds
  triggers:
  - trigger: state
    entity_id: input_boolean.doorbell_active
    to: 'on'
    for:
      seconds: 30
  conditions: []
  actions:
  - action: input_boolean.turn_off
    data:
      entity_id: input_boolean.doorbell_active
  mode: single

- id: 'doorbell_ring_trigger'
  alias: Doorbell Ring - Trigger AI
  description: When Vivint doorbell rings, POST snapshot to doorbell AI webhook
  triggers:
  - trigger: state
    entity_id: event.doorbell_doorbell
  - trigger: state
    entity_id: binary_sensor.doorbell_motion
    to: 'on'
  conditions: []
  actions:
  - action: rest_command.doorbell_ai_trigger
    data: {}
  mode: single
