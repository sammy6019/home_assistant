services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: vectordb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arxiv_papers}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./vector_db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-arxiv_papers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./vector_db
    container_name: vectordb_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-arxiv_papers}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "0.0.0.0:5050:5000"
    volumes:
      - ./vector_db:/app

volumes:
  pgdata:
